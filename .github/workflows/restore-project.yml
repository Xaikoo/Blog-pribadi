name: Restore Project from ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restore-project-from-zip
  cancel-in-progress: true

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unzip project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="tukesh.in-main.zip"
          EXTRACT_DIR=".zip-extract"
          PROJECT_DIR="$EXTRACT_DIR/tukesh.in-main"

          test -f "$ZIP"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          echo "Unzipping $ZIP..."
          unzip -q "$ZIP" -d "$EXTRACT_DIR"

          test -d "$PROJECT_DIR"

      - name: Arrange project for repository root
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=".zip-extract/tukesh.in-main"

          echo "Placing the extracted project at repository root..."
          cp -a "$PROJECT_DIR"/. .

          echo "Removing only import artifacts..."
          rm -rf ".zip-extract"
          rm -f "tukesh.in-main.zip"
          rm -f ".gitkeep"
          rm -f ".github/workflows/restore-project.yml"

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          test -f "package.json"
          test -f "package-lock.json"

          test ! -d ".zip-extract"
          test ! -f "tukesh.in-main.zip"

          echo "Project restored successfully at repository root."

      - name: Commit restored project
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "chore: restore project from source archive"
          git push origin HEAD:main
