name: Extract ZIP (Vanilla)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP without modification
        shell: bash
        run: |
          set -euo pipefail

          ZIP="tukesh.in-main.zip"

          test -f "$ZIP"

          unzip -q "$ZIP"

      - name: Commit extracted files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No extracted changes detected."
            exit 0
          fi

          git commit -m "chore: extract project archive"
          git push origin HEAD:main
