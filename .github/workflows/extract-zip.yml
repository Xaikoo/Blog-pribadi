name: Extract ZIP (Vanilla)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unzip and arrange project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="tukesh.in-main.zip"
          TMP=".tukesh-extract"
          ROOT="$TMP/tukesh.in-main"

          test -f "$ZIP"

          rm -rf "$TMP"
          mkdir -p "$TMP"

          echo "Unzipping archive..."
          unzip -q "$ZIP" -d "$TMP"

          test -d "$ROOT"

          echo "Arranging extracted project at repository root..."
          cp -a "$ROOT"/. .

          echo "Removing temporary import files..."
          rm -rf "$TMP"
          rm -f "$ZIP"

          echo "Removing temporary workflow..."
          rm -f ".github/workflows/extract-zip.yml"

      - name: Commit arranged project
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "chore: extract and arrange project"
          git push origin HEAD:main
