name: Extract ZIP (Vanilla)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract and arrange ZIP contents
        shell: bash
        run: |
          set -euo pipefail

          ZIP="tukesh.in-main.zip"
          TMP=".tukesh-extract"

          test -f "$ZIP"

          rm -rf "$TMP"
          mkdir -p "$TMP"

          echo "Extracting archive exactly as packaged..."
          unzip -q "$ZIP" -d "$TMP"

          TOP_LEVEL_DIR="$TMP/tukesh.in-main"
          test -d "$TOP_LEVEL_DIR"

          echo "Replacing repository working tree with extracted project..."

          find . -mindepth 1 -maxdepth 1             ! -name ".git"             ! -name "$TMP"             ! -name "$ZIP"             -exec rm -rf {} +

          cp -a "$TOP_LEVEL_DIR"/. .

          rm -rf "$TMP"
          rm -f "$ZIP"

      - name: Commit extracted project
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "chore: extract project archive to repository root"
          git push origin HEAD:main
