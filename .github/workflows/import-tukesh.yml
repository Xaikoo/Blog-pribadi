name: Import Tukesh Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Tukesh project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="tukesh.in-main.zip"
          TMP=".tukesh-import"

          echo "Checking ZIP..."
          test -f "$ZIP"

          rm -rf "$TMP"
          mkdir -p "$TMP"

          echo "Extracting ZIP..."
          unzip -q "$ZIP" -d "$TMP"

          ROOT="$TMP/tukesh.in-main"
          test -d "$ROOT"

          echo "Removing old project files..."

          find . -mindepth 1 -maxdepth 1             ! -name ".git"             ! -name "$TMP"             ! -name "$ZIP"             -exec rm -rf {} +

          echo "Copying Tukesh project to repository root..."

          cp -a "$ROOT"/. .

          echo "Removing temporary files..."

          rm -rf "$TMP"
          rm -f "$ZIP"

          echo "Configuring Git..."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Replace repository with Tukesh project"
          git push origin HEAD:main
